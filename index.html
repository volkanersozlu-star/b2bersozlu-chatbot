<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PDF Chatbot</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 720px;
      height: 90vh;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.10);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      padding: 18px 24px;
      background: #1a1a2e;
      color: #fff;
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: 0.3px;
    }

    header span {
      font-size: 0.8rem;
      font-weight: 400;
      opacity: 0.6;
      display: block;
      margin-top: 2px;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .msg {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: 12px;
      line-height: 1.55;
      font-size: 0.95rem;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .msg.user {
      background: #1a1a2e;
      color: #fff;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }

    .msg.bot {
      background: #f0f2f5;
      color: #1a1a2e;
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }

    .msg.loading {
      opacity: 0.6;
    }

    .dots span {
      display: inline-block;
      width: 7px;
      height: 7px;
      margin: 0 2px;
      background: #666;
      border-radius: 50%;
      animation: bounce 1.2s infinite ease-in-out;
    }

    .dots span:nth-child(2) { animation-delay: 0.2s; }
    .dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0.7); opacity: 0.5; }
      40% { transform: scale(1); opacity: 1; }
    }

    .input-row {
      display: flex;
      gap: 10px;
      padding: 16px 24px;
      border-top: 1px solid #e8e8e8;
      background: #fff;
    }

    #input {
      flex: 1;
      padding: 12px 16px;
      border: 1.5px solid #ddd;
      border-radius: 10px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
      resize: none;
      height: 48px;
      line-height: 1.4;
      font-family: inherit;
    }

    #input:focus { border-color: #1a1a2e; }

    #send-btn {
      padding: 0 22px;
      background: #1a1a2e;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      height: 48px;
    }

    #send-btn:hover { background: #2d2d4e; }
    #send-btn:disabled { background: #aaa; cursor: not-allowed; }

    .feedback-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 5px;
      padding-left: 2px;
    }
    .feedback-row span { font-size: 0.75rem; color: #aaa; }
    .fb-btn {
      background: none;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      padding: 2px 8px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: background 0.15s;
    }
    .fb-btn:hover { background: #f0f0f0; }
    .fb-btn.selected-up   { border-color: #16a34a; background: #f0fdf4; }
    .fb-btn.selected-down { border-color: #dc2626; background: #fef2f2; }
    .fb-thanks { font-size: 0.75rem; color: #888; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      PDF Chatbot
      <span>Belgelerdeki bilgilere dayalı yanıtlar</span>
    </header>

    <div id="messages">
      <div class="msg bot">Merhaba! PDF belgelerinizle ilgili sorularınızı sorabilirsiniz.</div>
    </div>

    <div class="input-row">
      <textarea id="input" placeholder="Sorunuzu yazın..." rows="1"></textarea>
      <button id="send-btn">Gönder</button>
    </div>
  </div>

  <script>
    const messagesEl = document.getElementById("messages");
    const inputEl = document.getElementById("input");
    const sendBtn = document.getElementById("send-btn");
    const history = []; // {role: "user"|"assistant", content: "..."}

    function addMessage(text, role) {
      const div = document.createElement("div");
      div.className = `msg ${role}`;
      div.textContent = text;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return div;
    }

    function addFeedback(question, answer) {
      const row = document.createElement("div");
      row.className = "feedback-row";
      row.innerHTML = `
        <span>Bu cevap işe yaradı mı?</span>
        <button class="fb-btn" data-val="up">👍</button>
        <button class="fb-btn" data-val="down">👎</button>
      `;
      messagesEl.appendChild(row);
      messagesEl.scrollTop = messagesEl.scrollHeight;

      row.querySelectorAll(".fb-btn").forEach(btn => {
        btn.addEventListener("click", async () => {
          const rating = btn.dataset.val;
          row.querySelectorAll(".fb-btn").forEach(b => b.disabled = true);
          btn.classList.add(rating === "up" ? "selected-up" : "selected-down");
          await fetch("/feedback", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ question, answer, rating }),
          });
          const thanks = document.createElement("span");
          thanks.className = "fb-thanks";
          thanks.textContent = "Teşekkürler!";
          row.appendChild(thanks);
        });
      });
    }

    function addLoading() {
      const div = document.createElement("div");
      div.className = "msg bot loading";
      div.innerHTML = '<div class="dots"><span></span><span></span><span></span></div>';
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return div;
    }

    async function sendMessage() {
      const text = inputEl.value.trim();
      if (!text) return;

      inputEl.value = "";
      sendBtn.disabled = true;
      addMessage(text, "user");
      const loader = addLoading();

      try {
        const res = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text, history }),
        });

        const data = await res.json();
        loader.remove();

        if (res.ok) {
          history.push({ role: "user", content: text });
          history.push({ role: "assistant", content: data.reply });
          addMessage(data.reply, "bot");
          addFeedback(text, data.reply);
        } else {
          addMessage("Hata: " + (data.detail || "Bilinmeyen hata"), "bot");
        }
      } catch {
        loader.remove();
        addMessage("Sunucuya bağlanılamadı. Lütfen backend'in çalıştığından emin olun.", "bot");
      } finally {
        sendBtn.disabled = false;
        inputEl.focus();
      }
    }

    sendBtn.addEventListener("click", sendMessage);

    inputEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });
  </script>
</body>
</html>
